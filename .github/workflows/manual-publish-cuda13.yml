name: Manual Publish CUDA13 Build
run-name: Manual Publish - CUDA13.3 ${{ github.event.inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: '发布版本号（示例：1.9.3）'
        required: true
        default: '1.9.3'
        type: text
      draft_release:
        description: '创建草稿Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    strategy:
      matrix:
        cuda-toolkit: [13.3]
        arch: [x64]
        sdl2: [ON, OFF]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ninja, ccache, 7-Zip, CMake
        run: |
          choco install ninja ccache 7zip cmake -y
          echo "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add MSBuild to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch SDL2 and set SDL2_DIR
        if: matrix.sdl2 == 'ON'
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-VC.zip" -OutFile SDL2.zip
          7z x SDL2.zip -oSDL2 -y
          echo "SDL2_DIR=$pwd\SDL2\SDL2-2.30.10" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install CUDA Toolkit ${{ matrix.cuda-toolkit }}
        shell: pwsh
        run: |
          $CUDA_VERSION = '${{ matrix.cuda-toolkit }}'
          $CUDA_TOOLKIT_DIR = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v' + $CUDA_VERSION
          $CUDA_DOWNLOAD = 'https://developer.download.nvidia.com/compute/cuda/redist'

          $CUDART_VER   = '13.3.29'
          $NVCC_VER     = '13.3.73'
          $NVRTC_VER    = '13.3.33'
          $CUBLAS_VER   = '13.6.0.2'
          $NVTX_VER     = '13.3.29'
          $PROFILER_VER = '13.3.27'
          $VS_VER       = '13.3.31'
          $CCCL_VER     = '13.2.86'
          $CRT_VER      = '13.3.33'
          $LIBNVVM_VER  = '13.3.33'

          New-Item -ItemType Directory -Force -Path $CUDA_TOOLKIT_DIR | Out-Null

          $packages = @(
            @{ Name='cuda_cudart';   Ver=$CUDART_VER },
            @{ Name='cuda_nvcc';     Ver=$NVCC_VER },
            @{ Name='cuda_nvrtc';    Ver=$NVRTC_VER },
            @{ Name='libcublas';     Ver=$CUBLAS_VER },
            @{ Name='cuda_nvtx';     Ver=$NVTX_VER },
            @{ Name='cuda_profiler_api'; Ver=$PROFILER_VER },
            @{ Name='visual_studio_integration'; Ver=$VS_VER },
            @{ Name='cuda_cccl';     Ver=$CCCL_VER },
            @{ Name='cuda_crt';      Ver=$CRT_VER },
            @{ Name='libnvvm';       Ver=$LIBNVVM_VER }
          )

          foreach ($pkg in $packages) {
            $url = "$CUDA_DOWNLOAD/$($pkg.Name)/windows-x86_64/$($pkg.Name)-windows-x86_64-$($pkg.Ver)-archive.zip"
            $zip = "$pwd\$($pkg.Name).zip"
            $tmpExtract = "$pwd\$($pkg.Name)-extract"
            
            Write-Host ">>> Downloading $($pkg.Name) v$($pkg.Ver) ..."
            curl.exe -sSL -o $zip $url
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $url" }

            $size = (Get-Item $zip).Length
            if ($size -lt 1024) {
              throw "Downloaded $zip is only $size bytes, likely 404. URL: $url"
            }

            Expand-Archive -Path $zip -DestinationPath $tmpExtract -Force

            $inner = Get-ChildItem $tmpExtract -Directory | Select-Object -First 1
            if (-not $inner) { throw "No directory found inside $tmpExtract" }

            Write-Host ">>> Merging $($inner.FullName) ..."
            & robocopy $inner.FullName $CUDA_TOOLKIT_DIR /E /NFL /NDL /NJH /NJS /nc /ns /np
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }

            Remove-Item $zip -Force
            Remove-Item $tmpExtract -Recurse -Force
          }

          $hostConfig = Join-Path $CUDA_TOOLKIT_DIR "include\crt\host_config.h"
          $cicc = Join-Path $CUDA_TOOLKIT_DIR "nvvm\bin\cicc.exe"
          if (-not (Test-Path $hostConfig)) { throw "FATAL: $hostConfig not found!" }
          if (-not (Test-Path $cicc)) { throw "FATAL: $cicc not found!" }
          Write-Host "OK: host_config.h and cicc.exe exist."

          $binPath = Join-Path $CUDA_TOOLKIT_DIR "bin"
          $nvvpPath = Join-Path $CUDA_TOOLKIT_DIR "libnvvp"
          
          "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$nvvpPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          
          "CUDA_PATH=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_PATH_V13_3=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          exit 0

      - name: Build whisper.cpp
        shell: pwsh
        run: |
          $vsdevcmd = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$vsdevcmd`" -arch=x64 && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
              }
          }

          nvcc --version
          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DWHISPER_SDL2=${{ matrix.sdl2 }} -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe"
          cmake --build .
          
          Write-Host "===== 输出文件列表 ====="
          Get-ChildItem bin\*.exe, bin\*.dll

      - name: Check ccache status after build
        run: |
          ccache -s

      - name: Prepare artifacts
        run: |
          $VERSION = "${{ github.event.inputs.release_version }}"
          $ZIP_NAME = "whisper-cublas-13.3-${{ matrix.arch }}-sdl${{ matrix.sdl2 }}-v$VERSION.zip"
          mkdir staging -Force

          # Ninja 产物在 build\bin\ 下
          Copy-Item build/bin/*.exe staging/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/*.dll staging/ -ErrorAction SilentlyContinue

          if ('${{ matrix.sdl2 }}' -eq 'ON') {
            Copy-Item "$env:SDL2_DIR\lib\x64\SDL2.dll" staging/
          }

          Copy-Item "$env:CUDA_PATH\bin\cudart64*.dll" staging/
          Copy-Item "$env:CUDA_PATH\bin\nvrtc64*.dll" staging/
          Copy-Item "$env:CUDA_PATH\bin\cublas64*.dll" staging/
          Copy-Item "$env:CUDA_PATH\bin\nvrtc-builtins64*.dll" staging/

          Compress-Archive -Path staging/* -DestinationPath "./$ZIP_NAME"
          Write-Host "打包文件列表："
          Get-ChildItem staging

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cuda13.3-${{ matrix.arch }}-sdl${{ matrix.sdl2 }}
          path: ./whisper-cublas-*.zip   # ← 精确匹配，排除 SDL2.zip

  publish-release:
    needs: build-windows-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect zip files
        run: |
          mv ./artifacts/*/*.zip ./
          ls -la *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: Release v${{ github.event.inputs.release_version }} (CUDA13.3 Windows)
          body: |
            ## Build Info
            - CUDA Version: 13.3
            - Arch: x64
            - Build Platform: windows-2022
            - SDL2 variants: ON / OFF
            - Powered by whisper.cpp
          files: ./*.zip
          draft: ${{ github.event.inputs.draft_release == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
